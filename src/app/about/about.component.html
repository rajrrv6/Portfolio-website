<div class="about-container">
  <div class="header-section">
    <h2>About Me</h2>
    <div class="divider"></div>
    <p class="intro-text">
      Innovative software developer with expertise in modern web technologies and passion for creating efficient solutions
    </p>
  </div>

  <div class="about-content">
    <div class="profile-section">
      <div class="image-wrapper">
        <img src="https://placehold.co/600x400" 
             alt="Portrait of a young software engineer smiling at camera with code visible on laptop screen">
        <div class="glow-border"></div>
      </div>

      <div class="details-grid">
        <div *ngFor="let detail of personalDetails" class="detail-item">
          <div class="detail-icon">{{detail.icon}}</div>
          <div class="detail-text">
            <h4>{{detail.title}}</h4>
            <p>{{detail.value}}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="timeline-section">
      <h3>My Journey</h3>
      <div class="timeline">
        <div *ngFor="let item of timelineItems" class="timeline-item">
          <div class="timeline-year">{{item.year}}</div>
          <div class="timeline-content">
            <h4>{{item.title}} &#64; {{item.company}}</h4>
            <p>{{item.description}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
