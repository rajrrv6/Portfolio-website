<div class="projects-container">
  <div class="header">
    <h2>My Projects</h2>
    <div class="divider"></div>
  </div>

  <div class="projects-grid">
    <div *ngFor="let project of projects" class="project-card">
      <div class="glow-effect"></div>
      <div class="card-content">
        <div class="image-container">
          <img [src]="project.image" [alt]="project.title + ' project screenshot'">
        </div>
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <div class="tags">
          <span *ngFor="let tag of project.tags">{{ tag }}</span>
        </div>
        <div class="links">
          <a [href]="project.demo" target="_blank" rel="noopener">Demo</a>
          <a [href]="project.code" target="_blank" rel="noopener">Code</a>
        </div>
      </div>
    </div>
  </div>
</div>
